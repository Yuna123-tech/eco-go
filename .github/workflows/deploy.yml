# main에 올라오면 bundle.js를 다시 빌드하고 GitHub Pages에 배포합니다.
name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: 배포할 파일만 모으기
        run: |
          mkdir _site
          cp -r index.html css js _site/
          touch _site/.nojekyll
          # 브라우저가 예전 파일을 쓰지 않도록 배포할 때마다 버전 번호를 붙입니다.
          ver="${GITHUB_SHA::7}"
          sed -i "s#js/bundle.js\"#js/bundle.js?v=${ver}\"#; s#css/style.css\"#css/style.css?v=${ver}\"#" _site/index.html
          grep -q "bundle.js?v=${ver}" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
